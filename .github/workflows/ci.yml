# Pruebas automáticas en cada push y pull request: dependencias con
# vulnerabilidades y pruebas del API contra una MariaDB vacía (nunca producción).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: crm_ci
          MARIADB_USER: crm
          MARIADB_PASSWORD: crm
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_NAME: crm_ci
      DB_USER: crm
      DB_PASS: crm
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_SSL: 'false'
      JWT_SECRET: ci-solo-para-pruebas-0123456789abcdef0123456789abcdef
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencias sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
      - name: Pruebas del API
        run: npm test
